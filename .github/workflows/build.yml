name: Build GePatch MH PRX
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build PRX
        run: |
          make clean || true
          make > build.log 2>&1 || (git config --global --add safe.directory '*' && git config --global user.name 'github-actions' && git config --global user.email 'github-actions@github.com' && git add build.log && git commit -m 'upload build log' && git push && exit 1)
          ls -la ge_mh_patch.prx
      
      - name: Upload PRX
        uses: actions/upload-artifact@v4
        with:
          name: ge_mh_patch
          path: ge_mh_patch.prx