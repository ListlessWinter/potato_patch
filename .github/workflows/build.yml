name: Build GePatch MH PRX
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build PRX
        run: |
          psp-objdump -d original.prx > dump.txt 2>&1 || true
          git config --global --add safe.directory '*'
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add dump.txt
          git commit -m 'upload PRX dump' || true
          git push || true
        uses: actions/upload-artifact@v4
        with:
          name: ge_mh_patch
          path: ge_mh_patch.prx